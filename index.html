<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Small Business Security Checkup — Pilot</title>
<style>
:root{--ink:#18332f;--muted:#5a6c68;--green:#177a65;--pale:#eaf5ef;--cream:#f8f9f5;--line:#dce5df;--orange:#a65b15;--shadow:0 18px 45px rgba(19,58,46,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#eaf3ee,#f9faf7 38%,#e8f2ef);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:860px;margin:0 auto;padding:30px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:-.4px}.mark{height:38px;width:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:23px}.pilot{font-size:12px;background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:50px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(22px,5vw,44px)}h1,h2,h3{letter-spacing:-.8px;line-height:1.18}h1{font-size:clamp(33px,5.5vw,51px);margin:12px 0 18px}h2{font-size:26px;margin:0 0 12px}h3{font-size:20px;margin:0 0 10px}p{margin:0 0 14px}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--green)}.pill{display:inline-block;border-radius:100px;background:var(--pale);color:#17614e;font-size:12px;font-weight:750;padding:6px 10px}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}.btn{border-radius:13px;padding:12px 19px;font-weight:750;border:1px solid var(--line);background:white;color:var(--ink);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn.primary{color:white;background:var(--green);border-color:var(--green)}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}.note{background:var(--cream);border:1px solid var(--line);padding:15px;border-radius:15px;font-size:14px;color:var(--muted)}.progress{height:9px;border-radius:99px;background:#e9eee9;overflow:hidden;margin:13px 0 24px}.progress span{display:block;height:100%;background:var(--green);transition:width .2s}.question{font-size:clamp(24px,4vw,32px);font-weight:800;line-height:1.25;letter-spacing:-.7px;margin:14px 0 15px}.option{display:flex;gap:12px;align-items:center;padding:14px 16px;margin:10px 0;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;background:#fff}.option:hover{border-color:#83ad9f}.option.selected{border-color:var(--green);background:var(--pale)}.option input{accent-color:var(--green);width:17px;height:17px;flex-shrink:0}.hint{font-size:14px;color:var(--muted);margin:0 0 18px}.small{font-size:13px}.section{padding:27px 0;border-bottom:1px solid var(--line)}.section:last-child{border:none}.good{display:flex;gap:12px;align-items:flex-start;margin:15px 0}.glyph{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:var(--pale);color:var(--green);display:grid;place-items:center;font-weight:bold}.issue{border:1px solid var(--line);border-radius:16px;padding:19px;margin:12px 0}.issuehead{display:flex;justify-content:space-between;align-items:start;gap:14px}.tag{font-size:11px;font-weight:bold;white-space:nowrap;border-radius:999px;background:#fff0df;color:#875118;padding:5px 9px}.tag.unknown{background:#edf1f5;color:#53646d}.pricecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.pricecard{border:1px solid var(--line);padding:17px;border-radius:15px}.amount{font-size:26px;font-weight:850;line-height:1.2;letter-spacing:-1px;margin:8px 0}.pricecard strong{font-size:18px}.pricecard button{margin-top:14px;width:100%}.freebox{background:var(--pale);border:1px solid #cde5d8;border-radius:15px;padding:19px;margin:12px 0}.list{padding-left:23px}.list li{margin:9px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.hidden{display:none!important}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0 13px}.foot{font-size:12px;color:var(--muted);padding-top:16px}.danger{border:1px solid #e8b6ab;background:#fff0ec;border-radius:15px;padding:19px}.feedback{margin-top:18px}.divider{height:1px;background:var(--line);margin:17px 0}details{margin:12px 0}summary{cursor:pointer;font-weight:700}body.printing .top,body.printing .actions,body.printing #feedbackSection,body.printing .noprint{display:none!important}@media(max-width:620px){.pricecards{grid-template-columns:1fr}.panel{border-radius:17px;padding:22px}.shell{padding:18px 12px 55px}.issuehead{flex-direction:column;gap:7px}}@media print{body{background:white}.shell{max-width:none;padding:0}.top,.actions,.noprint,#feedbackSection{display:none!important}.panel{border:none;box-shadow:none;padding:0}.section{break-inside:avoid}.issue{break-inside:avoid}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><span class="mark">✓</span><span>Business Security Guide</span></div><span class="pilot">DEMO • fictional details only</span></div><div id="app" class="panel"></div><div class="foot">Pilot prototype • Based on self-reported answers • No accounts, scans, or real purchases • Answers stay in this browser session; they are not sent to a server by this app.</div></main>
<script>
'use strict';
const Q=[
{id:'size',title:'How many people work at your business, including you?',opts:['Just me','2–5 people','6–20 people','21–50 people','More than 50'],area:'About your business'},
{id:'type',title:'What kind of business do you run?',opts:['Retail or restaurant','Professional services','Construction or trades','Healthcare or wellness','Online business or technology','Something else'],area:'About your business'},
{id:'depend',title:'Which of these do you depend on to run your business?',opts:['Business email','Computers or tablets','Online business software','Payment or checkout systems','Website or online store','Something else'],multi:true,area:'About your business',hint:'Choose all that apply.'},
{id:'sensitive',title:'Do you keep personal or confidential information about customers or employees?',opts:['Yes','No',"I'm not sure"],area:'About your business'},
{id:'it',title:'Who usually takes care of computer or technology problems for your business?',opts:['I do','An employee','An outside IT person or company','Nobody in particular',"I'm not sure"],area:'About your business'},
{id:'mfa',title:'Do you use extra sign-in protection, like a code or phone approval, for important business accounts?',opts:['All important accounts','Some accounts','No',"I'm not sure"],area:'Your accounts',hint:'This is also called two-step verification. It means someone needs more than a password to sign in.'},
{id:'password',title:'How do you and your employees handle passwords?',opts:['Unique passwords or a password manager','We try to use different passwords','We sometimes share or reuse passwords',"I'm not sure"],area:'Your accounts'},
{id:'updates',title:'Do your business computers regularly install updates?',opts:['Automatically','When we remember','Rarely or never',"I'm not sure"],area:'Your computers'},
{id:'antivirus',title:'Do your business computers have security or antivirus protection turned on?',opts:['All computers','Some computers','No',"I'm not sure"],area:'Your computers',hint:'Many Windows and Mac computers include built-in protection.'},
{id:'backup',title:'If an important business file was lost, could you get it back?',opts:["Yes, we've tested our backups","We have backups but haven't tested them",'No',"I'm not sure"],area:'Your information',hint:'A backup is an extra copy you can recover if a file is deleted, damaged, or lost.'},
{id:'scam',title:'Do you and your employees know how to recognize fake emails, suspicious links, or payment scams?',opts:['Yes, with regular reminders',"We've talked about it",'Not really',"I'm not sure"],area:'Your people'},
{id:'incident',title:'Have you noticed anything suspicious involving your business computers, accounts, or payments in the past year?',opts:['No','Yes','Maybe',"I'm not sure"],area:'If something goes wrong'},
{id:'response',title:'If something went wrong with your computers or accounts, would you know who to call and what to do first?',opts:['Yes, we have a plan','We know who to call','No',"I'm not sure"],area:'If something goes wrong'},
{id:'revenue',title:'About how much money does your business bring in on a typical working day?',opts:['Less than $500','$500–$2,000','$2,000–$5,000','More than $5,000','Prefer not to say / not sure'],area:'Optional: business impact',hint:'Optional. This means business sales or revenue, not your personal income or profit. You can skip.' ,optional:true},
{id:'downtime',title:'If your main computers or business software stopped working, how long could you keep operating normally?',opts:["We'd have to stop right away",'A few hours','About a day','Several days','We could keep running',"I'm not sure"],area:'Optional: business impact',optional:true}
];
const follow={
size:{trigger:a=>a.size&&a.size!=='Just me',q:{id:'depart',title:'When someone leaves your business, do you make sure they can no longer access business accounts?',opts:['Yes, promptly','Usually, but no set process','No',"I'm not sure"]}},
sensitive:{trigger:a=>a.sensitive==='Yes',q:{id:'datatype',title:'What kind of confidential information do you keep?',opts:['Customer contact information','Employee information','Financial or payment information','Medical or health information','Something else'],multi:true,hint:'Choose all that apply. Please do not share any actual records.'}},
mfa:{trigger:a=>['Some accounts','No'].includes(a.mfa),q:{id:'mfawhere',title:'Which important accounts might still need extra sign-in protection?',opts:['Business email','Payments or banking','Cloud software or files','Other accounts',"I'm not sure"],multi:true}},
password:{trigger:a=>a.password==='We sometimes share or reuse passwords',q:{id:'shared',title:'Do multiple people use the same login for important business accounts?',opts:['Yes','No',"I'm not sure"]}},
backup:{trigger:a=>a.backup==="We have backups but haven't tested them",q:{id:'backupwhere',title:'Do you know where your backup copies are kept?',opts:['In a cloud backup service','On an external drive or another computer','Our IT provider handles this',"I'm not sure"]}},
incident:{trigger:a=>['Yes','Maybe'].includes(a.incident),q:{id:'active',title:'Could that suspicious activity still be happening right now?',opts:['Yes, it might be','No, it has stopped',"I'm not sure"],hint:'If you suspect an active attack, getting immediate assistance matters more than finishing this checkup.'}},
depend:{trigger:a=>Array.isArray(a.depend)&&a.depend.some(x=>['Payment or checkout systems','Online business software'].includes(x)),q:{id:'fallback',title:'If your main online service or payment system stopped working, do you have another way to keep running?',opts:['Yes','Partly','No',"I'm not sure"]}}
};
const catalog=[
{id:'mfa',positive:['All important accounts'],partial:['Some accounts'],bad:['No'],good:'You said your important accounts use extra sign-in protection. That is a strong habit to keep!',title:'Finish adding extra sign-in protection',why:'Extra sign-in protection makes it harder for someone to access accounts using a stolen password.',free:'Check your business email security settings and turn on two-step verification where it is missing. Ask your account administrator first if the setting is managed for your company.',nist:'PR.AA-03',priority:3},
{id:'password',positive:['Unique passwords or a password manager'],partial:['We try to use different passwords'],bad:['We sometimes share or reuse passwords'],good:'You reported using unique passwords or a password manager. That helps protect your accounts.',title:'Stop sharing or reusing passwords',why:'If one reused password is stolen, several accounts could be at risk.',free:'Start with your business email: use a unique, strong password. Where possible, give each person their own account instead of sharing one login.',nist:'PR.AA-03',priority:3},
{id:'updates',positive:['Automatically'],partial:['When we remember'],bad:['Rarely or never'],good:'You mentioned that computers receive updates automatically. Keeping software current is an important security habit.',title:'Check whether your computers receive updates',why:'Updates often fix weaknesses that criminals could exploit.',free:'On Windows, review Settings → Windows Update. On Mac, review System Settings → General → Software Update. Look at the status first; avoid unexpected restarts on critical work computers.',nist:'PR.PS-02',priority:2},
{id:'antivirus',positive:['All computers'],partial:['Some computers'],bad:['No'],good:'You reported security protection on all your business computers. That is a useful safeguard.',title:'Check security protection on each computer',why:'Computers without active protection may be more exposed to malicious software.',free:'Check whether your computer’s built-in security tool is enabled. If an IT provider manages the device, ask them what protection is installed.',nist:'PR.PS / DE.CM',priority:2},
{id:'backup',positive:["Yes, we've tested our backups"],partial:["We have backups but haven't tested them"],bad:['No'],good:'You have already tested recovering backed-up files. That is an important step many businesses overlook.',title:'Make sure you can recover important business files',why:'If files are deleted, damaged, or locked by ransomware, working backups can help you get back to business.',free:'List your most important files, find out where the copies are kept, and check for recent backup errors. Do not overwrite live files during a restore test.',nist:'PR.DS-11',priority:4},
{id:'scam',positive:['Yes, with regular reminders'],partial:["We've talked about it"],bad:['Not really'],good:'You reported regularly reminding your team about scams. That is a great habit worth continuing.',title:'Give your team a quick scam refresher',why:'Fake messages and payment requests can trick people into sharing information or sending money.',free:'Remind everyone to verify unusual payment requests using a phone number they already trust, not the contact details in the suspicious message.',nist:'PR.AT-01',priority:2},
{id:'response',positive:['Yes, we have a plan'],partial:['We know who to call'],bad:['No'],good:'You said you have a plan for when something goes wrong. That preparation can save valuable time.',title:'Make a simple emergency contact plan',why:'Knowing whom to contact can help you respond faster to suspicious activity.',free:'Write down your IT contact, email provider support, bank fraud number, and the person who can make decisions during an incident. Keep the list somewhere accessible if systems are offline.',nist:'RS.MA / RS.CO',priority:2},
{id:'depart',positive:['Yes, promptly'],partial:['Usually, but no set process'],bad:['No'],good:'You reported removing access when employees leave. That helps keep accounts under control.',title:'Remove access when people leave',why:'Former employees or contractors may keep access they no longer need.',free:'Make a simple departure checklist covering email, shared software, passwords, keys, and accounts.',nist:'PR.AA-05',priority:3},
{id:'fallback',positive:['Yes'],partial:['Partly'],bad:['No'],good:'You have thought about how to keep working if an important online service stops. That is useful preparation.',title:'Plan for an outage of an important service',why:'A payment or online software outage could interrupt work or sales.',free:'Write down which service matters most and one safe fallback—such as a documented manual process—without bypassing payment or privacy safeguards.',nist:'GV.SC / ID.RA',priority:2}
];
const state={a:{},index:0,mode:'welcome',completed:false};let steps=[];
const el=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildSteps(){let arr=[];let follows=0;for(const q of Q){arr.push(q);const branch=follow[q.id];if(branch?.trigger(state.a)&&(q.id==='incident'||follows<3)){arr.push(branch.q);if(q.id!=='incident')follows++;}}return arr}
function rerender(){steps=buildSteps();if(state.mode==='welcome') return welcome();if(state.mode==='survey')return survey();return report()}
function welcome(){el.innerHTML=`<span class="eyebrow">Free interactive pilot</span><h1>Let's make your business a little safer.</h1><p>I'll ask a few everyday questions about your computers, accounts, and important files. When you're finished, I'll show you what you're already doing well, what we should look at next, and a couple of free tips to get started.</p><div class="note"><b>For this demonstration, please use fictional details.</b> Don't enter passwords, real account information, customer records, or confidential details. This demo doesn't scan or access your devices.</div><div class="actions"><button class="btn primary" id="start">Start my free checkup →</button><button class="btn" id="demo">Try a sample business</button></div><p class="muted small" style="margin-top:20px">Around 5–8 minutes • No account required • No payment required</p>`;document.getElementById('start').onclick=()=>{state.mode='survey';state.index=0;rerender()};document.getElementById('demo').onclick=()=>{Object.assign(state.a,{size:'2–5 people',type:'Professional services',depend:['Business email','Computers or tablets','Online business software'],sensitive:'Yes',datatype:['Customer contact information'],it:'I do',mfa:'Some accounts',mfawhere:['Cloud software or files'],password:'We sometimes share or reuse passwords',shared:'Yes',updates:'Automatically',antivirus:'All computers',backup:"We have backups but haven't tested them",backupwhere:'In a cloud backup service',scam:"We've talked about it",incident:'No',response:'We know who to call',depart:'Usually, but no set process',revenue:'$500–$2,000',downtime:'About a day'});state.mode='report';rerender()}}
function survey(){steps=buildSteps();state.index=Math.min(state.index,steps.length-1);const q=steps[state.index], v=state.a[q.id],pct=Math.round((state.index+1)/steps.length*100);const isMulti=q.multi;let ops=q.opts.map(o=>{const selected=isMulti?Array.isArray(v)&&v.includes(o):v===o;return `<label class="option ${selected?'selected':''}"><input type="${isMulti?'checkbox':'radio'}" name="answer" value="${esc(o)}" ${selected?'checked':''}><span>${esc(o)}</span></label>`}).join('');el.innerHTML=`<div class="row"><span class="eyebrow">${esc(q.area||'One quick follow-up')}</span><span class="small muted">Question ${state.index+1} of ${steps.length}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="question">${esc(q.title)}</div>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}<div id="choices">${ops}</div>${q.optional?'<p class="small muted">This question is optional.</p>':''}<div class="actions"><button class="btn" id="back">← Back</button><button class="btn primary" id="next">${state.index===steps.length-1?'See my results →':'Continue →'}</button>${q.optional?'<button class="btn" id="skip">Skip</button>':''}</div>`;document.querySelectorAll('#choices input').forEach(inp=>inp.onchange=()=>{if(isMulti){let vals=Array.isArray(state.a[q.id])?[...state.a[q.id]]:[];if(inp.checked&&!vals.includes(inp.value))vals.push(inp.value);else if(!inp.checked)vals=vals.filter(x=>x!==inp.value);state.a[q.id]=vals}else state.a[q.id]=inp.value;survey()});document.getElementById('back').onclick=()=>{if(state.index===0){state.mode='welcome'}else state.index--;rerender()};document.getElementById('next').onclick=()=>{if(!q.optional&&(!v||(Array.isArray(v)&&v.length===0))){alert('Please choose an answer, or use “I’m not sure” where available.');return} const rebuilt=buildSteps();state.index++;if(state.index>=rebuilt.length){state.mode='report'}rerender()};if(q.optional)document.getElementById('skip').onclick=()=>{delete state.a[q.id];state.index++;if(state.index>=buildSteps().length)state.mode='report';rerender()}}
function findings(){let good=[],issues=[],unknown=[];for(const c of catalog){const v=state.a[c.id];if(!v)continue;if(c.positive.includes(v)){good.push(c.good)}else if(c.partial.includes(v)||c.bad.includes(v)){issues.push({...c,kind:c.bad.includes(v)?'concern':'partial'})}else if(v==="I'm not sure"){unknown.push(c)}}if(state.a.mfa==='Some accounts')good.unshift('You have already added extra sign-in protection to some accounts. That is a good start.');if(state.a.backup==="We have backups but haven't tested them")good.push('You have backup copies in place. That is a valuable first step—even though we still need to check whether they can be restored.');if(state.a.it==='An outside IT person or company')good.push('You have an IT contact you can turn to when problems happen. We have not checked what security work they provide.');if(state.a.incident==='No'){}if(state.a.it==='Nobody in particular'||state.a.it==="I'm not sure") issues.push({id:'it',title:'Decide who looks after your business technology',why:'When nobody owns this job, important updates or security tasks may be missed.',free:'Choose a point person and make a short list of recurring security checks. This can be you, an employee, or an existing IT provider.',nist:'GV.RR',priority:2,kind:state.a.it==="I'm not sure"?'unknown':'concern'});if(state.a.incident==='Yes'||state.a.incident==='Maybe'){issues.push({id:'incident',title:'Follow up on the suspicious activity you noticed',why:'We cannot tell from these answers whether the activity was harmful or whether it has stopped.',free:'If it may still be happening, contact your existing IT/security support promptly. For suspected fraudulent transfers, call your bank immediately using a trusted number. Avoid deleting evidence.',nist:'DE.AE / RS.AN',priority:5,kind:'concern'})}issues.sort((a,b)=>b.priority-a.priority);return {good,issues,unknown}}
function money(){const a=state.a;const range={'Less than $500':'under $500','$500–$2,000':'$500–$2,000','$2,000–$5,000':'$2,000–$5,000','More than $5,000':'over $5,000'}[a.revenue];if(!range)return '<p>You could face lost time, recovery bills, or interrupted sales if an important system goes down. We haven’t asked for enough financial information to put a responsible dollar range on that.</p>';return `<p>You estimated that your business brings in <strong>${esc(range)} per typical working day</strong>. If a major system were unavailable for a whole working day and you couldn't continue operations, roughly that amount of daily revenue could be affected.</p><p class="small muted">Revenue affected is not the same as money lost. Some work might be delayed or recovered. This is an illustrative scenario, not a prediction; recovery costs are not included.</p>`}
function report(){const f=findings(),a=state.a,urgent=['Yes, it might be',"I'm not sure"].includes(a.active)&&(a.incident==='Yes'||a.incident==='Maybe');let goodHtml=f.good.slice(0,4).map(x=>`<div class="good"><span class="glyph">✓</span><div>${esc(x)}</div></div>`).join('')||'<p>Taking the time to check your business security is a useful first step. We didn’t receive enough positive responses to confirm particular habits, and that’s okay—we can start with what you know.</p>';let issueHtml=f.issues.slice(0,3).map((x,i)=>`<div class="issue"><div class="issuehead"><h3>${i+1}. ${esc(x.title)}</h3><span class="tag">${x.kind==='unknown'?'Needs checking':'Based on your answers'}</span></div><p>${esc(x.why)}</p><p><strong>Free next step:</strong> ${esc(x.free)}</p><details><summary>Why are we recommending this?</summary><p class="small muted">Linked to NIST CSF 2.0: ${esc(x.nist)}. This is based on your questionnaire answer, not a verified security check.</p></details></div>`).join('')||'<p>No specific weaknesses were reported by your answers. That doesn’t prove your systems are secure; it just means this initial questionnaire did not surface a clear concern.</p>';let unknownHtml=f.unknown.length?`<p class="small muted"><strong>Things we still need to check:</strong> ${f.unknown.map(x=>esc(x.title.replace(/^(Check |Make sure )/i,''))).join('; ')}. “I’m not sure” never counts as a failed security check.</p>`:'';let top=f.issues.slice(0,3);el.innerHTML=`<div class="row"><span class="eyebrow">Your free checkup results</span><span class="pill">Pilot report</span></div><h1>You're taking a useful step toward a safer business.</h1><p>Thanks for walking through those questions. Let's start with the good things you reported, then look at what may need attention.</p><div class="note"><b>Important:</b> This report uses only your answers. We haven't inspected accounts, tested backups, or checked any computers. It's an introductory, NIST-aligned checkup—not an audit, certification, or guarantee of protection.</div>${urgent?`<section class="section"><div class="danger"><h3>⚠️ Please deal with the possible active problem first</h3><p>You indicated suspicious activity may still be happening. Please seek prompt help from your trusted IT/security contact. If payments or banking are involved, contact your bank's fraud team using an independently verified number. Don't delay getting help to finish this report or buy a plan.</p></div></section>`:''}<section class="section"><h2>👍 First, here's what you're already doing right!</h2>${goodHtml}</section><section class="section"><h2>🔎 Here's what I'd look at next</h2><p class="muted">These are the most relevant concerns reported in your answers, not confirmed vulnerabilities.</p>${issueHtml}${unknownHtml}${f.issues.length>3?`<details><summary>See ${f.issues.length-3} more things to work on</summary>${f.issues.slice(3).map(x=>`<div class="issue"><h3>${esc(x.title)}</h3><p>${esc(x.why)}</p><p><b>Free first step:</b> ${esc(x.free)}</p></div>`).join('')}</details>`:''}</section><section class="section"><h2>💵 What could a problem cost your business?</h2>${money()}</section><section class="section"><h2>🎁 Here's some free help to get started</h2><div class="freebox"><strong>No purchase needed.</strong><p>Whenever a safe, simple step can help, we want you to know about it.</p><ul class="list">${(top.length?top.slice(0,2):catalog.slice(0,2)).map(x=>`<li>${esc(x.free)}</li>`).join('')}</ul></div></section><section class="section"><h2>✅ Your next three steps</h2><ol class="list">${top.length?top.map(x=>`<li>${esc(x.title)} — <span class="muted">${esc(x.free)}</span></li>`).join(''):'<li>Keep your good security habits going.</li><li>Check uncertain answers with an IT provider if available.</li><li>Review your protections periodically.</li>'}</ol></section><section class="section noprint"><h2>Want more help? Your choice.</h2><p>The free information above is yours to keep. These are <strong>proposed services and sample prices</strong> for our pilot; nothing here can be purchased in this demo.</p><div class="pricecards"><div class="pricecard"><span class="pill">Free</span><div class="amount">$0</div><strong>Free Checkup</strong><p class="small muted">The results and simple guidance you just received.</p></div><div class="pricecard"><span class="pill">One-time</span><div class="amount">$29</div><strong>My DIY Security Plan</strong><p class="small muted">A full personalized improvement checklist and detailed safe walkthroughs.</p></div><div class="pricecard"><span class="pill">Proposed from</span><div class="amount">$149+</div><strong>Do It for Me</strong><p class="small muted">Scoped assistance with approved fixes, priced before any work begins.</p></div><div class="pricecard"><span class="pill">Proposed monthly</span><div class="amount">$19 / $39 / $79</div><strong>Monthly Care</strong><p class="small muted">Basic, Plus, or Complete; coverage and limits would be explained before purchase. DIY plan included.</p></div></div><p class="small muted" style="margin-top:14px">For this demo, no payments, subscriptions, device checks, or repairs are available. A previous $29 DIY-plan purchase might receive an eligible subscription credit in a future offering.</p></section><section class="section noprint" id="feedbackSection"><h2>Help us improve this pilot</h2><p>Would you use this service for your business? Your feedback helps us improve the questions and report.</p><form id="feedback"><label>Was the survey easy to understand?<select class="input" name="easy" required><option value="">Choose one</option><option>Very easy</option><option>Mostly easy</option><option>Somewhat confusing</option><option>Very confusing</option></select></label><label>Was the free report useful?<select class="input" name="useful" required><option value="">Choose one</option><option>Very useful</option><option>Somewhat useful</option><option>Not useful</option></select></label><label>Would you consider paying $29 for a fuller DIY plan?<select class="input" name="pay" required><option value="">Choose one</option><option>Yes</option><option>Maybe</option><option>No</option></select></label><label>What would you change or improve?<textarea class="input" name="notes" rows="3" placeholder="Your thoughts (no sensitive details)"></textarea></label><button class="btn primary" type="submit">Download my pilot feedback</button><p class="small muted">The feedback downloads to your device; this prototype does not collect it on a server. You can send the downloaded file to the pilot organizer.</p></form></section><div class="actions noprint"><button class="btn primary" id="print">Print / Save PDF</button><button class="btn" id="answerFile">Download my answers</button><button class="btn" id="restart">Start again</button></div><p class="muted small" style="margin-top:18px">Whatever you decide, you have a clearer picture of what to check next. You don't have to fix everything today.</p>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('answerFile').onclick=()=>download('checkup-answers.json',{surveyVersion:'1.1',responses:state.a});document.getElementById('restart').onclick=()=>{state.a={};state.index=0;state.mode='welcome';rerender()};document.getElementById('feedback').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));download('pilot-feedback.json',{surveyVersion:'1.1',reportVersion:'1.6-prototype',feedback:obj});}}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const x=document.createElement('a');x.href=url;x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
rerender();
</script></body></html>
